# 実サーバ (yuniruyuni.net の VPS) に対する疎通確認。
#
# self test は同一ランナー上に issuer と sshd を立てて検証している。
# こちらは「トンネル越しの実サーバへ、本物の証明書で接続できるか」を
# 確認する。ネットワーク経路と NixOS モジュールを含めた通しの検査。
name: VPS demo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vps-demo.yml'

permissions:
  contents: read
  id-token: write

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Get certificate
        id: cert
        uses: ./action
        with:
          endpoint: https://ssh-ca.yuniruyuni.net
          audience: https://ssh-ca.yuniruyuni.net

      - name: Install cloudflared
        run: |
          CLOUDFLARED_VERSION="2026.7.3"
          curl -fsSL "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64" -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared

      - name: force-command が強制されること
        run: |
          set -euo pipefail
          out="$(ssh \
            -o "ProxyCommand=cloudflared access ssh --hostname %h" \
            -o "IdentityFile=${{ steps.cert.outputs.key-path }}" \
            -o "CertificateFile=${{ steps.cert.outputs.certificate-path }}" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o BatchMode=yes \
            deploy@ssh.yuniruyuni.net 'status')"
          echo "$out"
          echo "$out" | grep -q 'force-command が強制されている' \
            || { echo "force-command が効いていない" >&2; exit 1; }

      - name: 許可されていない動詞は拒否されること
        run: |
          set -euo pipefail
          if ssh \
            -o "ProxyCommand=cloudflared access ssh --hostname %h" \
            -o "IdentityFile=${{ steps.cert.outputs.key-path }}" \
            -o "CertificateFile=${{ steps.cert.outputs.certificate-path }}" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o BatchMode=yes \
            deploy@ssh.yuniruyuni.net 'cat /etc/shadow' > /tmp/out 2>&1; then
            echo "任意コマンドが実行できてしまった:" >&2
            cat /tmp/out >&2
            exit 1
          fi
          echo "拒否された (期待通り):"
          cat /tmp/out
