name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - run: go vet ./...
      - run: go test -race ./...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - run: go build ./...

  action:
    name: Action
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: action
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: action/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: node --test src/*.test.ts

      # bundle の更新漏れは JS action の典型的な事故。dist が
      # ソースと一致していることを CI で強制する。
      - run: npm run build
      - name: dist が最新であること
        run: |
          if ! git diff --exit-code -- dist; then
            echo "dist がソースと一致していない。'npm run build' の結果を commit すること。" >&2
            exit 1
          fi

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          # パッチ版まで含めて最新を取る。到達可能な標準ライブラリの
          # 脆弱性はツールチェーンの更新で消えることが多いため。
          go-version: 'stable'
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  nix:
    name: Nix build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-25.11
      - run: nix build .#oidc-ssh-ca --print-build-logs
      - run: ./result/bin/oidc-ssh-ca --help 2>&1 | head -20 || true
      - name: NixOS モジュールが評価できること
        run: nix eval .#nixosModules.default --apply builtins.isFunction
