name: 'Get SSH certificate from oidc-ssh-ca'
description: >
  GitHub Actions の OIDC トークンを oidc-ssh-ca に提示し、短命な SSH
  ユーザ証明書を取得して配置する。長期の秘密鍵を GitHub secrets に置く
  必要がなくなる。鍵と証明書はジョブ終了時に削除される。

inputs:
  endpoint:
    description: 'oidc-ssh-ca の URL (例: https://ssh-ca.example.net)'
    required: true
  audience:
    description: 'OIDC トークンの audience。既定は endpoint と同じ値'
    required: false
    default: ''
  known-hosts:
    description: >
      known_hosts に追記する内容。ホスト鍵の行か @cert-authority 行を渡す。
      未指定で host を使う場合は警告する。接続先を検証しなければ、短命な
      資格情報をそのまま中間者へ渡すことになるため。
    required: false
    default: ''
  host:
    description: '設定する場合、この Host 名で ssh_config に接続設定を書く'
    required: false
    default: ''
  hostname:
    description: 'host を指定した場合の実際の接続先'
    required: false
    default: ''
  ssh-user:
    description: 'host を指定した場合の SSH ログインユーザ'
    required: false
    default: ''

outputs:
  key-path:
    description: '生成した秘密鍵のパス'
  certificate-path:
    description: '取得した証明書のパス'
  principals:
    description: '証明書に含まれる principal (カンマ区切り)'
  valid-before:
    description: '有効期限 (Unix 時刻)'

runs:
  using: node24
  main: dist/main/index.js
  post: dist/cleanup/index.js
